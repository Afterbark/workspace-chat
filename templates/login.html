{% extends "auth_base.html" %}
{% block title %}Sign in{% endblock %}
{% block heading %}Welcome <em>back</em>{% endblock %}
{% block sub %}Sign in to pick up your conversations.{% endblock %}
{% block form %}
        <form method="POST">
            <div class="field">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" autocomplete="username" autocapitalize="off" spellcheck="false" required autofocus>
            </div>
            <div class="field">
                <label for="password">Password</label>
                <div class="control">
                    <input type="password" id="password" name="password" autocomplete="current-password" required>
                    <button type="button" class="reveal" onclick="togglePw(this)" aria-pressed="false">Show</button>
                </div>
            </div>
            <button type="submit" class="submit"><span>Sign in</span></button>
        </form>
{% endblock %}
{% block links %}
        <div class="links">
            <a href="/reset_password">Forgot password?</a>
            <span>New here? <a href="/register">Create an account</a></span>
        </div>
{% endblock %}
